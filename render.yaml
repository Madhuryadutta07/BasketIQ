# Render Blueprint — deploys BasketIQ (React frontend + Express API) as ONE free web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: basketiq
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string when Render asks
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret for you
